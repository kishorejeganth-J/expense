<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070e" />
    <meta
      name="description"
      content="Finora is a private, local-first personal expense and budget tracker with beautiful cashflow analytics."
    />
    <title>Finora · Personal Expense & Budget Tracker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310b981'/%3E%3Cpath d='M20 46V23c0-3 2.4-5 5.4-5H46M20 33h23' stroke='%23052118' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='45' cy='30' r='4.5' fill='%23052118'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("finora.expense-tracker.v1");
          var theme = raw ? JSON.parse(raw).settings.theme : "dark";
          var dark = theme !== "light";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
